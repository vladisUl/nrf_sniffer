# Available runners configured by board.cmake.
runners:
- nrfjprog
- pyocd

# Default flash runner if --runner is not given.
flash-runner: nrfjprog

# Default debug runner if --runner is not given.
debug-runner: jlink

# Common runner configuration values.
config:
  board_dir: E:/ncs_workspaces/project/new/802154_sniffer/boards/others/promicro_nrf52840_my
  # Build outputs:
  elf_file: zephyr.elf
  hex_file: zephyr.hex
  bin_file: zephyr.bin
  # Host tools:
  gdb: E:/ncs_toolchains/toolchains/dcbdc366a1/opt/zephyr-sdk/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb-py.exe

# Runner specific arguments
args:
  nrfjprog:
    []

  pyocd:
    - --dt-flash=y
    - --target=nrf52840
    - --frequency=4000000
